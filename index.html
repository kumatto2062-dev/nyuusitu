<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室耐久ツール（同期のみ）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #333;
    --accent: #3A7AFE;
    --danger: #FF4D4D;
    --success: #4CAF50;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 30px;
    font-weight: 700;
  }

  #totalBox,
  .item,
  #inputCard,
  #teikiCard {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    width: 100%;
  }

  #totalBox {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    font-size: 20px;
  }

  @media (max-width: 600px) {
    .item {
      flex-direction: row;
      font-size: 20px;
    }
    .item-name {
      max-width: 120px;
      word-break: break-word;
      font-size: 20px;
    }
  }

  .icon-btn {
    width: 65px;
    height: 65px;
    border-radius: 16px;
    border: none;
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }

  .minus { background: var(--danger); color: white; }
  .plus { background: var(--success); color: white; }

  .item-name {
    flex: 1;
    font-weight: 600;
    font-size: 24px;
    text-align: center;
    word-break: break-word;
  }

  .item-step-input input {
    width: 100%;
    font-size: 22px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    text-align: center;
  }

  .delete {
    background: #b0b0b0;
    color: white;
    padding: 12px 20px;
    border-radius: 14px;
    border: none;
    font-size: 20px;
    box-shadow: var(--shadow);
  }

  .order-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .order-btn {
    background: var(--accent);
    color: white;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 20px;
    border: none;
    box-shadow: var(--shadow);
  }

  #inputCard label,
  #teikiCard label {
    font-size: 22px;
    font-weight: 600;
    display: block;
    margin-bottom: 12px;
  }

  #inputCard input {
    width: 100%;
    font-size: 22px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    text-align: center;
    margin-bottom: 12px;
  }

  #teikiCard textarea {
    width: 100%;
    height: 140px;
    font-size: 20px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    margin-bottom: 12px;
  }

  button.main-btn {
    background: var(--accent);
    color: white;
    width: 100%;
    padding: 20px;
    font-size: 26px;
    border-radius: 16px;
    margin-top: 10px;
    border: none;
    box-shadow: var(--shadow);
  }

  #popupOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 150;
  }

  #popup {
    background: var(--card);
    padding: 30px;
    border-radius: 22px;
    width: calc(100% - 40px);
    max-width: 360px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  #popup input {
    width: 100%;
    font-size: 22px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    text-align: center;
    margin-bottom: 20px;
  }

  #popup button {
    background: var(--accent);
    color: white;
    padding: 14px 20px;
    font-size: 22px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    width: 100%;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>入室耐久ツール（同期のみ）</h1>

<div id="popupOverlay">
  <div id="popup">
    <h2>目標人数を入力</h2>
    <input id="goalInput" type="number" placeholder="例：100">
    <button onclick="setGoal()">決定</button>
    <button onclick="closePopup()">閉じる</button>
  </div>
</div>

<div id="totalBox">
  合計人数：<span id="total">0</span> / <span id="goal">0</span>
</div>

<button id="setGoalBtn" class="main-btn">目標人数を設定する</button>

<div id="items"></div>

<div id="inputCard">
  <label>新しい項目を追加</label>
  <input id="newItemName" placeholder="項目名（例：受付A）">
  <input id="newItemStep" type="number" placeholder="増減人数（例：3）">
</div>

<button id="addBtn" class="main-btn">追加する</button>

<div id="teikiCard">
  <label>定期文章（○○○ の部分に人数が入ります）</label>
  <textarea id="teikiText" placeholder="例：現在○○○人です！目標まで頑張ります！"></textarea>

  <button id="saveTeikiBtn" class="main-btn">定期入力</button>
  <button id="showTeikiBtn" class="main-btn">定期出力</button>
  <button id="shareBtn" class="main-btn">共有URLを作成</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCY6r1ZzM9fz9k0QFROcLghAaBWPlxFXJs",
    authDomain: "nyuusitu.firebaseapp.com",
    projectId: "nyuusitu",
    storageBucket: "nyuusitu.firebasestorage.app",
    messagingSenderId: "52996193895",
    appId: "1:52996193895:web:637df16d38513bd77b9ec2",
    measurementId: "G-JGLQ6MGVMD",
    databaseURL: "https://nyuusitu-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const params = new URLSearchParams(location.search);
  const roomId = params.get("room") || "default";
  const path = (key) => `${roomId}/${key}`;

  let items = [];
  let teikiText = "";

  document.getElementById("setGoalBtn").onclick = () => {
    document.getElementById("popupOverlay").style.display = "flex";
    document.getElementById("popup").innerHTML = `
      <h2>目標人数を入力</h2>
      <input id="goalInput" type="number" placeholder="例：100">
      <button onclick="setGoal()">決定</button>
      <button onclick="closePopup()">閉じる</button>
    `;
  };

  window.closePopup = function () {
    document.getElementById("popupOverlay").style.display = "none";
  };

  window.setGoal = function () {
    const goal = document.getElementById("goalInput").value;
    set(ref(db, path("goal")), goal);
    closePopup();
  };

  function render() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    const total = items.reduce((sum, item) => sum + item.count, 0);
    document.getElementById("total").textContent = total;

    items.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <button class="icon-btn minus" onclick="change(${index}, -${item.step})">−</button>
        <div class="item-name">${item.name}</div>
        <div class="item-step-input">
          <input type="number" value="${item.step}" onchange="updateStep(${index}, this.value)">
        </div>
        <button class="icon-btn plus" onclick="change(${index}, ${item.step})">＋</button>
        <button class="delete" onclick="deleteItem(${index})">削除</button>
        <div class="order-buttons">
          <button class="order-btn" onclick="moveUp(${index})">↑</button>
          <button class="order-btn" onclick="moveDown(${index})">↓</button>
        </div>
      `;

      container.appendChild(div);
    });
  }

  function sync() {
    set(ref(db, path("items")), items);
  }

  window.change = (index, diff) => {
    items[index].count += diff;
    sync();
  };

  window.updateStep = (index, newStep) => {
    items[index].step = Number(newStep);
    sync();
  };

  window.deleteItem = (index) => {
    items.splice(index, 1);
    sync();
  };

  window.moveUp = (index) => {
    if (index === 0) return;
    [items[index - 1], items[index]] = [items[index], items[index - 1]];
    sync();
  };

  window.moveDown = (index) => {
    if (index === items.length - 1) return;
    [items[index + 1], items[index]] = [items[index], items[index + 1]];
    sync();
  };

  document.getElementById("addBtn").onclick = () => {
    const name = document.getElementById("newItemName").value.trim();
    const step = Number(document.getElementById("newItemStep").value);

    if (!name || !step) {
      alert("項目名と人数を入力してください");
      return;
    }

    items.push({ name, step, count: 0 });
    sync();

    document.getElementById("newItemName").value = "";
    document.getElementById("newItemStep").value = "";
  };

  document.getElementById("saveTeikiBtn").onclick = () => {
    const text = document.getElementById("teikiText").value.trim();
    if (!text) {
      alert("定期文章を入力してください");
      return;
    }
    set(ref(db, path("teiki")), text);
    alert("定期文章を保存しました");
  };

  onValue(ref(db, path("teiki")), (snapshot) => {
    const data = snapshot.val();
    teikiText = data || "";
    document.getElementById("teikiText").value = teikiText;
  });

  document.getElementById("showTeikiBtn").onclick = () => {
    if (!teikiText) {
      alert("定期文章が保存されていません");
      return;
    }

    const total = items.reduce((sum, item) => sum + item.count, 0);
    const goal = Number(document.getElementById("goal").textContent);
    const output = teikiText.replace(/○○○/g, `${total}/${goal}`);

    document.getElementById("popup").innerHTML = `
      <h2>定期文章</h2>
      <p id="teikiOutput" style="font-size:20px; white-space:pre-wrap; margin:20px 0;">${output}</p>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button onclick="copyTeiki()">コピーする</button>
        <button onclick="closePopup()">閉じる</button>
      </div>
    `;
    document.getElementById("popupOverlay").style.display = "flex";
  };

  window.copyTeiki = function () {
    const text = document.getElementById("teikiOutput").innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("コピーしました！");
    });
  };

  function randomId() {
    return Math.random().toString(36).substring(2, 10);
  }

  document.getElementById("shareBtn").onclick = async () => {
    const shareId = randomId();
    const data = {
      items,
      teikiText,
      goal: Number(document.getElementById("goal").textContent)
    };
    await set(ref(db, `share/${shareId}`), data);
    const url = `${location.origin}${location.pathname}?share=${shareId}`;
    navigator.clipboard.writeText(url).then(() => {
      alert("共有URLをコピーしました！\n\n" + url);
    });
  };

  (async function loadShared() {
    const shareId = params.get("share");
    if (!shareId) return;
    const snapshot = await get(ref(db, `share/${shareId}`));
    const shared = snapshot.val();
    if (!shared) return;

    items = shared.items || [];
    teikiText = shared.teikiText || "";
    const goalValue = shared.goal || 0;

    await set(ref(db, path("items")), items);
    await set(ref(db, path("teiki")), teikiText);
    await set(ref(db, path("goal")), goalValue);
  })();

  onValue(ref(db, path("goal")), (snapshot) => {
    const goal = snapshot.val();
    if (goal !== null) {
      document.getElementById("goal").textContent = goal;
    }
  });

  onValue(ref(db, path("items")), (snapshot) => {
    const data = snapshot.val();
    items = data || [];
    render();
  });
</script>

</body>
</html>
