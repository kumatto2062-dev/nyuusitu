<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室人数管理ツール</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f6f8;--card:#fff;--text:#333;--accent:#3A7AFE;
  --danger:#FF4D4D;--success:#4CAF50;--gray:#777;
  --shadow:0 4px 12px rgba(0,0,0,.08)
}
body{font-family:Segoe UI,sans-serif;max-width:900px;margin:auto;padding:20px;background:var(--bg);color:var(--text)}
h1{text-align:center;margin:0 0 20px;font-size:30px}
.card,#totalBox{background:var(--card);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
#totalBox{text-align:center;font-size:28px;font-weight:bold}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.icon-btn{width:58px;height:58px;border-radius:14px;border:none;font-size:30px;font-weight:bold;cursor:pointer;color:#fff;flex:none}
.minus{background:var(--danger)}.plus{background:var(--success)}
.item-name{flex:1;min-width:0;font-weight:600;font-size:22px;text-align:center;word-break:normal;overflow-wrap:break-word;line-height:1.35}
.count{min-width:90px;text-align:center;font-size:24px;font-weight:bold}
.item-step-input{width:100px}.item-step-input input,
input,textarea{width:100%;font-size:20px;padding:12px;border-radius:14px;border:1px solid #ccc;background:#f9f9f9}
.delete,.order-btn{border:none;border-radius:12px;cursor:pointer;color:#fff}
.delete{background:#999;padding:11px 14px;font-size:16px}
.order-buttons{display:flex;flex-direction:column;gap:5px}.order-btn{background:var(--accent);padding:8px 12px;font-size:18px}
label{font-size:21px;font-weight:600;display:block;margin-bottom:10px}
.main-btn{background:var(--accent);color:#fff;width:100%;padding:18px;font-size:23px;border-radius:16px;margin-top:10px;border:none;box-shadow:var(--shadow);cursor:pointer}
.main-btn:active,.icon-btn:active,.delete:active,.order-btn:active{transform:scale(.98)}
textarea{height:140px;resize:vertical}
#status{text-align:center;font-size:14px;color:var(--gray);margin:8px 0 18px}
#popupOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
#popup{background:#fff;padding:26px;border-radius:22px;width:100%;max-width:480px;box-shadow:var(--shadow);text-align:center;max-height:90vh;overflow:auto}
#popup button{background:var(--accent);color:#fff;padding:13px 18px;font-size:20px;border-radius:14px;border:none;cursor:pointer;width:100%;margin-top:10px}
#popup .secondary{background:#777}
.output-box{white-space:pre-wrap;text-align:left;background:#f5f6f8;padding:16px;border-radius:12px;font-size:18px;line-height:1.7}
@media(max-width:600px){
  body{padding:12px}h1{font-size:25px}
  .item{gap:6px;padding:10px}.icon-btn{width:48px;height:48px;font-size:25px}
  .item-name{font-size:16px;line-height:1.3;word-break:normal;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.count{min-width:55px;font-size:20px}
  .item-step-input{width:70px}.item-step-input input{font-size:17px;padding:9px}
  .delete{padding:9px 7px;font-size:14px}.order-btn{padding:6px 8px;font-size:16px}
}
</style>
</head>
<body>

<h1>入室人数管理ツール</h1>
<div id="status">接続中…</div>

<div id="totalBox">
  現在人数：<span id="total">0</span> / <span id="goal">0</span>人
</div>

<button id="setGoalBtn" class="main-btn">目標人数を設定する</button>

<div id="items"></div>

<div class="card">
  <label for="newItemName">新しい項目を追加</label>
  <input id="newItemName" placeholder="項目名（例：受付A）">
  <input id="newItemStep" type="number" min="1" value="1" placeholder="1回の増減人数" style="margin-top:10px">
  <button id="addBtn" class="main-btn">項目を追加する</button>
</div>

<div class="card">
  <label for="teikiText">定期文章</label>
  <div style="font-size:14px;color:#666;margin-bottom:8px">
    ○○○ → 現在人数、△△△ → 目標人数、□□□ → 現在人数/目標人数
  </div>
  <textarea id="teikiText" placeholder="例：現在○○○人です！目標△△△人まで頑張ります！"></textarea>
  <button id="saveTeikiBtn" class="main-btn">定期文章を保存</button>
  <button id="showTeikiBtn" class="main-btn">現在状況を出力</button>
  <button id="shareBtn" class="main-btn">共有URLを作成</button>
</div>

<div id="popupOverlay">
  <div id="popup"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey:"AIzaSyCYr6Z1zM9fz9k0QFROcLghAaBWPlxFXJs",
  authDomain:"nyuusitu.firebaseapp.com",
  projectId:"nyuusitu",
  storageBucket:"nyuusitu.firebasestorage.app",
  messagingSenderId:"52996193895",
  appId:"1:52996193895:web:637df16d38513bd77b9ec2",
  measurementId:"G-JGLQ6MGVMD",
  databaseURL:"https://nyuusitu-default-rtdb.firebaseio.com/"
};

const params = new URLSearchParams(location.search);
const roomId = params.get("room") || "default";
const shareId = params.get("share");
const path = key => `${roomId}/${key}`;

let items = [];
let goal = 0;
let teikiText = "";
let db = null;
let firebaseReady = false;

const $ = id => document.getElementById(id);
const popupOverlay = $("popupOverlay");
const popup = $("popup");

function setStatus(text, error=false){
  $("status").textContent = text;
  $("status").style.color = error ? "#d33" : "#777";
}

function openPopup(html){
  popup.innerHTML = html;
  popupOverlay.style.display = "flex";
}
function closePopup(){
  popupOverlay.style.display = "none";
}

popupOverlay.addEventListener("click", e => {
  if(e.target === popupOverlay) closePopup();
});

function totalCount(){
  return items.reduce((sum,item)=>sum + (Number(item.count)||0),0);
}

function updateTotal(){
  $("total").textContent = totalCount();
  $("goal").textContent = goal;
}

function safeText(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function render(){
  updateTotal();
  const container = $("items");
  container.innerHTML = "";

  items.forEach((item,index)=>{
    item.step = Math.max(1, Number(item.step)||1);
    item.count = Number(item.count)||0;

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <button class="icon-btn minus" type="button">−</button>
      <div class="item-name">${safeText(item.name)}</div>
      <div class="count">${item.count}</div>
      <div class="item-step-input">
        <input type="number" min="1" value="${item.step}" aria-label="増減人数">
      </div>
      <button class="icon-btn plus" type="button">＋</button>
      <button class="delete" type="button">削除</button>
      <div class="order-buttons">
        <button class="order-btn up" type="button">↑</button>
        <button class="order-btn down" type="button">↓</button>
      </div>
    `;

    div.querySelector(".minus").addEventListener("click",()=>{
      items[index].count -= items[index].step;
      render();
      syncItems();
    });

    div.querySelector(".plus").addEventListener("click",()=>{
      items[index].count += items[index].step;
      render();
      syncItems();
    });

    div.querySelector("input").addEventListener("change",e=>{
      const value = Number(e.target.value);
      items[index].step = Math.max(1,value||1);
      render();
      syncItems();
    });

    div.querySelector(".delete").addEventListener("click",()=>{
      if(!confirm(`「${item.name}」を削除しますか？`)) return;
      items.splice(index,1);
      render();
      syncItems();
    });

    div.querySelector(".up").addEventListener("click",()=>{
      if(index===0) return;
      [items[index-1],items[index]]=[items[index],items[index-1]];
      render();
      syncItems();
    });

    div.querySelector(".down").addEventListener("click",()=>{
      if(index===items.length-1) return;
      [items[index+1],items[index]]=[items[index],items[index+1]];
      render();
      syncItems();
    });

    container.appendChild(div);
  });
}

async function syncItems(){
  if(!firebaseReady) return;
  try{
    await db.ref(path("items")).set(items);
    setStatus("保存しました");
  }catch(err){
    console.error(err);
    setStatus("保存に失敗しました。FirebaseのDatabaseルールを確認してください。",true);
  }
}

async function setGoal(value){
  goal = Math.max(0,Number(value)||0);
  updateTotal();
  if(!firebaseReady) return;
  try{
    await db.ref(path("goal")).set(goal);
    setStatus("目標人数を保存しました");
  }catch(err){
    console.error(err);
    setStatus("目標人数の保存に失敗しました。FirebaseのDatabaseルールを確認してください。",true);
  }
}

$("setGoalBtn").addEventListener("click",()=>{
  openPopup(`
    <h2>目標人数を入力</h2>
    <input id="goalInput" type="number" min="0" value="${goal}" placeholder="例：100">
    <button id="goalSetBtn" type="button">決定</button>
    <button id="goalCloseBtn" class="secondary" type="button">閉じる</button>
  `);

  $("goalSetBtn").addEventListener("click",async()=>{
    await setGoal($("goalInput").value);
    closePopup();
  });
  $("goalCloseBtn").addEventListener("click",closePopup);
});

$("addBtn").addEventListener("click",()=>{
  const name=$("newItemName").value.trim();
  const step=Math.max(1,Number($("newItemStep").value)||1);

  if(!name){
    alert("項目名を入力してください");
    $("newItemName").focus();
    return;
  }

  items.push({name,step,count:0});
  render();
  syncItems();
  $("newItemName").value="";
  $("newItemStep").value="1";
});

$("saveTeikiBtn").addEventListener("click",async()=>{
  const text=$("teikiText").value.trim();
  if(!text){
    alert("定期文章を入力してください");
    $("teikiText").focus();
    return;
  }
  teikiText=text;

  if(firebaseReady){
    try{
      await db.ref(path("teiki")).set(teikiText);
      setStatus("定期文章を保存しました");
      alert("定期文章を保存しました");
    }catch(err){
      console.error(err);
      setStatus("定期文章の保存に失敗しました。",true);
      alert("保存に失敗しました。FirebaseのDatabaseルールを確認してください。");
    }
  }else{
    alert("定期文章を設定しました");
  }
});

$("showTeikiBtn").addEventListener("click",()=>{
  if(!teikiText){
    alert("定期文章を入力・保存してください");
    return;
  }

  const total=totalCount();
  const output=teikiText
    .replace(/○○○/g,String(total))
    .replace(/△△△/g,String(goal))
    .replace(/□□□/g,`${total}/${goal}`);

  const detail=items.length
    ? "\n\n【項目別】\n"+items.map(i=>`${i.name}：${i.count}人`).join("\n")
    : "";

  const fullOutput=output+detail;

  openPopup(`
    <h2>現在状況</h2>
    <div id="teikiOutput" class="output-box">${safeText(fullOutput)}</div>
    <button id="copyTeikiBtn" type="button">コピーする</button>
    <button id="closeTeikiBtn" class="secondary" type="button">閉じる</button>
  `);

  $("copyTeikiBtn").addEventListener("click",async()=>{
    try{
      await navigator.clipboard.writeText(fullOutput);
      alert("コピーしました！");
    }catch(err){
      // HTTP環境などでclipboard APIが使えない場合の代替
      const ta=document.createElement("textarea");
      ta.value=fullOutput;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      alert("コピーしました！");
    }
  });
  $("closeTeikiBtn").addEventListener("click",closePopup);
});

function randomId(){
  return Math.random().toString(36).substring(2,10)+Date.now().toString(36);
}

$("shareBtn").addEventListener("click",async()=>{
  if(!firebaseReady){
    alert("Firebaseに接続できていないため共有URLを作成できません。");
    return;
  }

  const shareKey=randomId();
  const data={
    items:items.map(i=>({name:i.name,step:i.step,count:i.count})),
    teikiText,
    goal
  };

  try{
    await db.ref(`share/${shareKey}`).set(data);
    const url=`${location.origin}${location.pathname}?share=${shareKey}`;
    try{
      await navigator.clipboard.writeText(url);
    }catch(e){}
    openPopup(`
      <h2>共有URLを作成しました</h2>
      <div class="output-box">${safeText(url)}</div>
      <button id="copyUrlBtn" type="button">URLをコピー</button>
      <button id="closeShareBtn" class="secondary" type="button">閉じる</button>
    `);
    $("copyUrlBtn").addEventListener("click",async()=>{
      try{
        await navigator.clipboard.writeText(url);
        alert("URLをコピーしました！");
      }catch(e){
        alert(url);
      }
    });
    $("closeShareBtn").addEventListener("click",closePopup);
  }catch(err){
    console.error(err);
    alert("共有URLの作成に失敗しました。FirebaseのDatabaseルールを確認してください。");
  }
});

async function loadShared(){
  if(!shareId || !firebaseReady) return;
  try{
    const snapshot=await db.ref(`share/${shareId}`).get();
    const shared=snapshot.val();
    if(!shared) return;

    items=Array.isArray(shared.items) ? shared.items : [];
    teikiText=shared.teikiText || "";
    goal=Number(shared.goal)||0;

    render();
    $("teikiText").value=teikiText;

    // 共有データを現在のroomにも反映
    await db.ref(path("items")).set(items);
    await db.ref(path("teiki")).set(teikiText);
    await db.ref(path("goal")).set(goal);
  }catch(err){
    console.error(err);
    setStatus("共有データの読み込みに失敗しました。",true);
  }
}

function startFirebase(){
  try{
    if(!window.firebase){
      setStatus("Firebase SDKを読み込めませんでした。",true);
      render();
      return;
    }

    firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    firebaseReady=true;
    setStatus("オンライン接続中");

    db.ref(path("goal")).on("value",snapshot=>{
      const value=snapshot.val();
      if(value!==null){
        goal=Number(value)||0;
        updateTotal();
      }
    },err=>{
      console.error(err);
      setStatus("Firebaseの読み込み権限がありません。",true);
    });

    db.ref(path("items")).on("value",snapshot=>{
      const data=snapshot.val();
      items=Array.isArray(data) ? data : [];
      render();
    },err=>{
      console.error(err);
      setStatus("項目データの読み込み権限がありません。",true);
    });

    db.ref(path("teiki")).on("value",snapshot=>{
      teikiText=snapshot.val() || "";
      $("teikiText").value=teikiText;
    },err=>{
      console.error(err);
    });

    loadShared();
  }catch(err){
    console.error(err);
    setStatus("Firebase接続エラー。基本操作は画面上で利用できます。",true);
    render();
  }
}

render();
startFirebase();
</script>
</body>
</html>
