<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室人数管理ツール</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f6fb;
  --card:rgba(255,255,255,.94);
  --text:#182230;
  --muted:#728096;
  --line:#e5eaf1;
  --accent:#4f6df5;
  --accent2:#7c5cff;
  --danger:#ef5b68;
  --success:#19a974;
  --shadow:0 12px 35px rgba(31,45,71,.09);
  --shadow-sm:0 5px 18px rgba(31,45,71,.08);
}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  max-width:980px;margin:0 auto;padding:28px 18px 60px;
  background:
    radial-gradient(circle at 10% 0%,rgba(124,92,255,.10),transparent 30%),
    radial-gradient(circle at 90% 5%,rgba(79,109,245,.10),transparent 28%),
    var(--bg);
  color:var(--text);min-height:100vh;
}
h1{
  text-align:center;margin:4px 0 5px;font-size:32px;letter-spacing:.02em;
  font-weight:800;
}
#status{text-align:center;font-size:13px;color:var(--muted);margin:0 0 24px}
#status::before{content:"●";font-size:9px;margin-right:6px;color:var(--success)}
.card,#totalBox{
  background:var(--card);border:1px solid rgba(255,255,255,.9);
  border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}
#totalBox{
  text-align:center;padding:28px 20px;
  background:linear-gradient(135deg,#ffffff,#f7f8ff);
  border:1px solid #e7eaff;
}
#totalBox::before{
  content:"CURRENT PARTICIPANTS";display:block;font-size:11px;letter-spacing:.14em;
  color:var(--muted);font-weight:800;margin-bottom:8px;
}
#total{font-size:54px;line-height:1;font-weight:900;color:var(--accent)}
#goal{font-size:28px;color:var(--muted)}
#totalBox{font-size:20px;font-weight:700}
.main-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;width:100%;padding:16px 18px;font-size:18px;font-weight:800;
  border-radius:16px;margin-top:10px;border:none;box-shadow:0 8px 18px rgba(79,109,245,.20);
  cursor:pointer;transition:.18s;
}
.main-btn:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(79,109,245,.25)}
.main-btn:active,.icon-btn:active,.delete:active,.order-btn:active{transform:scale(.98)}
label{font-size:16px;font-weight:800;display:block;margin-bottom:9px}
input,textarea{
  width:100%;font-size:17px;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:#f8fafc;color:var(--text);
  outline:none;transition:.15s;
}
input:focus,textarea:focus{border-color:#9aabff;box-shadow:0 0 0 4px rgba(79,109,245,.10);background:#fff}
textarea{height:130px;resize:vertical;line-height:1.6}
.section-title{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.section-title span{font-size:20px}
.section-title strong{font-size:18px}
.item{
  display:grid;grid-template-columns:54px minmax(130px,1fr) 76px 86px 54px 44px;
  align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:12px;margin-bottom:11px;box-shadow:var(--shadow-sm);
}
.icon-btn{
  width:54px;height:54px;border-radius:15px;border:none;font-size:28px;font-weight:800;
  cursor:pointer;color:#fff;flex:none;transition:.15s;
}
.icon-btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.minus{background:linear-gradient(135deg,#ff6875,#e94d5e)}
.plus{background:linear-gradient(135deg,#25bd88,#0c9d6b)}
.item-name{min-width:0;font-weight:800;font-size:18px;overflow-wrap:anywhere;line-height:1.35}
.count{
  text-align:center;font-size:28px;font-weight:900;color:var(--accent);
  background:#f1f4ff;border-radius:13px;padding:9px 4px;
}
.item-step-input{width:100%}
.item-step-input input{font-size:15px;padding:10px;text-align:center}
.delete,.order-btn{
  border:none;border-radius:12px;cursor:pointer;color:#fff;transition:.15s;
}
.delete{background:#9aa4b2;padding:10px 7px;font-size:13px;font-weight:700}
.delete:hover{background:#7f8998}
.order-buttons{display:flex;flex-direction:column;gap:4px}
.order-btn{background:#e9edff;color:#5268d8;padding:6px;font-size:15px;font-weight:800}
.order-btn:hover{background:#dce3ff}
.hint{font-size:13px;color:var(--muted);line-height:1.6;margin:-2px 0 10px}
#popupOverlay{
  position:fixed;inset:0;background:rgba(18,27,43,.52);display:none;
  align-items:center;justify-content:center;z-index:1000;padding:18px;
  backdrop-filter:blur(5px);
}
#popup{
  background:#fff;padding:25px;border-radius:24px;width:100%;max-width:500px;
  box-shadow:0 25px 70px rgba(0,0,0,.20);text-align:center;
  max-height:90vh;overflow:auto;
}
#popup h2{margin:0 0 17px;font-size:22px}
#popup button{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  padding:13px 18px;font-size:17px;font-weight:800;border-radius:14px;
  border:none;cursor:pointer;width:100%;margin-top:10px;
}
#popup .secondary{background:#edf0f5;color:#566274}
.output-box{
  white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;
  background:#f6f8fc;border:1px solid var(--line);padding:16px;border-radius:14px;
  font-size:17px;line-height:1.7;
}
@media(max-width:700px){
  body{padding:18px 11px 40px}
  h1{font-size:25px}
  .card,#totalBox{border-radius:20px;padding:16px}
  #total{font-size:46px}
  #goal{font-size:24px}
  .item{
    grid-template-columns:45px minmax(0,1fr) 62px 45px;
    gap:7px;padding:9px;border-radius:17px;
  }
  .icon-btn{width:45px;height:45px;font-size:23px;border-radius:13px}
  .item-name{font-size:15px}
  .count{font-size:22px;padding:8px 2px}
  .item-step-input{grid-column:2;grid-row:2}
  .item-step-input input{font-size:14px;padding:8px}
  .delete{grid-column:3;grid-row:2;padding:8px 5px}
  .order-buttons{grid-column:4;grid-row:2}
  .main-btn{font-size:17px;padding:15px}
}
</style>
</head>
<body>

<h1>入室人数管理ツール</h1>
<div id="status">接続中…</div>

<div id="totalBox">
  現在人数：<span id="total">0</span> / <span id="goal">0</span>人
</div>

<button id="setGoalBtn" class="main-btn">目標人数を設定する</button>

<div class="section-title"><span>👥</span><strong>参加者・項目</strong></div><div id="items"></div>

<div class="card">
  <div class="section-title"><span>➕</span><strong>新しい項目を追加</strong></div>
  <input id="newItemName" placeholder="項目名（例：受付A）">
  <input id="newItemStep" type="number" min="1" value="1" placeholder="1回の増減人数" style="margin-top:10px">
  <button id="addBtn" class="main-btn">項目を追加する</button>
</div>

<div class="card">
  <div class="section-title"><span>📝</span><strong>定期文章・共有</strong></div>
  <div class="hint">
    ○○○ → 現在人数、△△△ → 目標人数、□□□ → 現在人数/目標人数
  </div>
  <textarea id="teikiText" placeholder="例：現在○○○人です！目標△△△人まで頑張ります！"></textarea>
  <button id="saveTeikiBtn" class="main-btn">定期文章を保存</button>
  <button id="showTeikiBtn" class="main-btn">現在状況を出力</button>
  <button id="shareBtn" class="main-btn">共有URLを作成</button>
</div>

<div id="popupOverlay">
  <div id="popup"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey:"AIzaSyCYr6Z1zM9fz9k0QFROcLghAaBWPlxFXJs",
  authDomain:"nyuusitu.firebaseapp.com",
  projectId:"nyuusitu",
  storageBucket:"nyuusitu.firebasestorage.app",
  messagingSenderId:"52996193895",
  appId:"1:52996193895:web:637df16d38513bd77b9ec2",
  measurementId:"G-JGLQ6MGVMD",
  databaseURL:"https://nyuusitu-default-rtdb.firebaseio.com/"
};

const params = new URLSearchParams(location.search);
const roomId = params.get("room") || "default";
const shareId = params.get("share");
const path = key => `${roomId}/${key}`;

let items = [];
let goal = 0;
let teikiText = "";
let db = null;
let firebaseReady = false;

const $ = id => document.getElementById(id);
const popupOverlay = $("popupOverlay");
const popup = $("popup");

function setStatus(text, error=false){
  $("status").textContent = text;
  $("status").style.color = error ? "#d33" : "#777";
}

function openPopup(html){
  popup.innerHTML = html;
  popupOverlay.style.display = "flex";
}
function closePopup(){
  popupOverlay.style.display = "none";
}

popupOverlay.addEventListener("click", e => {
  if(e.target === popupOverlay) closePopup();
});

function totalCount(){
  return items.reduce((sum,item)=>sum + (Number(item.count)||0),0);
}

function updateTotal(){
  $("total").textContent = totalCount();
  $("goal").textContent = goal;
}

function safeText(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function makeItemId(){
  if(window.crypto && typeof crypto.randomUUID === "function"){
    return crypto.randomUUID();
  }
  return `item_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
}

function normalizeItems(data){
  if(!data) return [];
  const list=Array.isArray(data) ? data : Object.values(data);
  return list.filter(Boolean).map(item=>({
    id:item.id || makeItemId(),
    name:String(item.name || "名称未設定"),
    step:Math.max(1,Number(item.step)||1),
    count:Number(item.count)||0
  }));
}

async function updateItemsTransaction(change,statusText="保存しました"){
  if(!firebaseReady) return;
  try{
    const result=await db.ref(path("items")).transaction(current=>{
      const currentItems=normalizeItems(current);
      return change(currentItems);
    });
    if(result.committed) setStatus(statusText);
  }catch(err){
    console.error(err);
    setStatus("保存に失敗しました。FirebaseのDatabaseルールを確認してください。",true);
  }
}

function changeCount(itemId,direction){
  setStatus("人数を更新中…");
  updateItemsTransaction(currentItems=>{
    const target=currentItems.find(current=>current.id===itemId);
    if(!target) return currentItems;
    const step=Math.max(1,Number(target.step)||1);
    target.count=(Number(target.count)||0)+(direction*step);
    return currentItems;
  },"人数を保存しました");
}

function render(){
  updateTotal();
  const container = $("items");
  container.innerHTML = "";

  items.forEach((item,index)=>{
    item.step = Math.max(1, Number(item.step)||1);
    item.count = Number(item.count)||0;

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <button class="icon-btn minus" type="button">−</button>
      <div class="item-name">${safeText(item.name)}</div>
      <div class="count">${item.count}</div>
      <div class="item-step-input">
        <input type="number" min="1" value="${item.step}" aria-label="増減人数">
      </div>
      <button class="icon-btn plus" type="button">＋</button>
      <button class="delete" type="button">削除</button>
      <div class="order-buttons">
        <button class="order-btn up" type="button">↑</button>
        <button class="order-btn down" type="button">↓</button>
      </div>
    `;

    div.querySelector(".minus").addEventListener("click",()=>changeCount(item.id,-1));

    div.querySelector(".plus").addEventListener("click",()=>changeCount(item.id,1));

    div.querySelector("input").addEventListener("change",e=>{
      const value = Number(e.target.value);
      const nextStep=Math.max(1,value||1);
      updateItemsTransaction(currentItems=>{
        const target=currentItems.find(current=>current.id===item.id);
        if(target) target.step=nextStep;
        return currentItems;
      });
    });

    div.querySelector(".delete").addEventListener("click",()=>{
      if(!confirm(`「${item.name}」を削除しますか？`)) return;
      updateItemsTransaction(currentItems=>currentItems.filter(current=>current.id!==item.id));
    });

    div.querySelector(".up").addEventListener("click",()=>{
      if(index===0) return;
      updateItemsTransaction(currentItems=>{
        const currentIndex=currentItems.findIndex(current=>current.id===item.id);
        if(currentIndex>0){
          [currentItems[currentIndex-1],currentItems[currentIndex]]=
            [currentItems[currentIndex],currentItems[currentIndex-1]];
        }
        return currentItems;
      });
    });

    div.querySelector(".down").addEventListener("click",()=>{
      if(index===items.length-1) return;
      updateItemsTransaction(currentItems=>{
        const currentIndex=currentItems.findIndex(current=>current.id===item.id);
        if(currentIndex>=0 && currentIndex<currentItems.length-1){
          [currentItems[currentIndex+1],currentItems[currentIndex]]=
            [currentItems[currentIndex],currentItems[currentIndex+1]];
        }
        return currentItems;
      });
    });

    container.appendChild(div);
  });
}

async function setGoal(value){
  goal = Math.max(0,Number(value)||0);
  updateTotal();
  if(!firebaseReady) return;
  try{
    await db.ref(path("goal")).set(goal);
    setStatus("目標人数を保存しました");
  }catch(err){
    console.error(err);
    setStatus("目標人数の保存に失敗しました。FirebaseのDatabaseルールを確認してください。",true);
  }
}

$("setGoalBtn").addEventListener("click",()=>{
  openPopup(`
    <h2>目標人数を入力</h2>
    <input id="goalInput" type="number" min="0" value="${goal}" placeholder="例：100">
    <button id="goalSetBtn" type="button">決定</button>
    <button id="goalCloseBtn" class="secondary" type="button">閉じる</button>
  `);

  $("goalSetBtn").addEventListener("click",async()=>{
    await setGoal($("goalInput").value);
    closePopup();
  });
  $("goalCloseBtn").addEventListener("click",closePopup);
});

$("addBtn").addEventListener("click",()=>{
  const name=$("newItemName").value.trim();
  const step=Math.max(1,Number($("newItemStep").value)||1);

  if(!name){
    alert("項目名を入力してください");
    $("newItemName").focus();
    return;
  }

  updateItemsTransaction(currentItems=>{
    currentItems.push({id:makeItemId(),name,step,count:0});
    return currentItems;
  },"項目を追加しました");
  $("newItemName").value="";
  $("newItemStep").value="1";
});

$("saveTeikiBtn").addEventListener("click",async()=>{
  const text=$("teikiText").value.trim();
  if(!text){
    alert("定期文章を入力してください");
    $("teikiText").focus();
    return;
  }
  teikiText=text;

  if(firebaseReady){
    try{
      await db.ref(path("teiki")).set(teikiText);
      setStatus("定期文章を保存しました");
      alert("定期文章を保存しました");
    }catch(err){
      console.error(err);
      setStatus("定期文章の保存に失敗しました。",true);
      alert("保存に失敗しました。FirebaseのDatabaseルールを確認してください。");
    }
  }else{
    alert("定期文章を設定しました");
  }
});

$("showTeikiBtn").addEventListener("click",()=>{
  if(!teikiText){
    alert("定期文章を入力・保存してください");
    return;
  }

  const total=totalCount();

  // 定期出力は「定期文章＋現在人数」だけを出力する。
  // PC/スマホで "\\n" が文字として表示される場合にも備えて、
  // 改行コードを実際の改行へ変換する。
  const fullOutput=teikiText
    .replace(/○○○/g,String(total))
    .replace(/△△△/g,String(goal))
    .replace(/□□□/g,`${total}/${goal}`)
    .replace(/\\\\n/g,"\\n");

  openPopup(`
    <h2>現在状況</h2>
    <div id="teikiOutput" class="output-box">${safeText(fullOutput)}</div>
    <button id="copyTeikiBtn" type="button">コピーする</button>
    <button id="closeTeikiBtn" class="secondary" type="button">閉じる</button>
  `);

  $("copyTeikiBtn").addEventListener("click",async()=>{
    try{
      await navigator.clipboard.writeText(fullOutput);
      alert("コピーしました！");
    }catch(err){
      // HTTP環境などでclipboard APIが使えない場合の代替
      const ta=document.createElement("textarea");
      ta.value=fullOutput;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      alert("コピーしました！");
    }
  });
  $("closeTeikiBtn").addEventListener("click",closePopup);
});

function randomId(){
  return Math.random().toString(36).substring(2,10)+Date.now().toString(36);
}

$("shareBtn").addEventListener("click",async()=>{
  if(!firebaseReady){
    alert("Firebaseに接続できていないため共有URLを作成できません。");
    return;
  }

  const shareKey=randomId();
  const data={
    items:items.map(i=>({id:i.id,name:i.name,step:i.step,count:i.count})),
    teikiText,
    goal
  };

  try{
    await db.ref(`share/${shareKey}`).set(data);
    const url=`${location.origin}${location.pathname}?share=${shareKey}`;
    try{
      await navigator.clipboard.writeText(url);
    }catch(e){}
    openPopup(`
      <h2>共有URLを作成しました</h2>
      <div class="output-box">${safeText(url)}</div>
      <button id="copyUrlBtn" type="button">URLをコピー</button>
      <button id="closeShareBtn" class="secondary" type="button">閉じる</button>
    `);
    $("copyUrlBtn").addEventListener("click",async()=>{
      try{
        await navigator.clipboard.writeText(url);
        alert("URLをコピーしました！");
      }catch(e){
        alert(url);
      }
    });
    $("closeShareBtn").addEventListener("click",closePopup);
  }catch(err){
    console.error(err);
    alert("共有URLの作成に失敗しました。FirebaseのDatabaseルールを確認してください。");
  }
});

async function loadShared(){
  if(!shareId || !firebaseReady) return;
  try{
    const snapshot=await db.ref(`share/${shareId}`).get();
    const shared=snapshot.val();
    if(!shared) return;

    items=normalizeItems(shared.items);
    teikiText=shared.teikiText || "";
    goal=Number(shared.goal)||0;

    render();
    $("teikiText").value=teikiText;

    // 共有データを現在のroomにも反映
    await db.ref(path("items")).set(items);
    await db.ref(path("teiki")).set(teikiText);
    await db.ref(path("goal")).set(goal);
  }catch(err){
    console.error(err);
    setStatus("共有データの読み込みに失敗しました。",true);
  }
}

function startFirebase(){
  try{
    if(!window.firebase){
      setStatus("Firebase SDKを読み込めませんでした。",true);
      render();
      return;
    }

    firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    firebaseReady=true;
    setStatus("オンライン接続中");

    db.ref(path("goal")).on("value",snapshot=>{
      const value=snapshot.val();
      if(value!==null){
        goal=Number(value)||0;
        updateTotal();
      }
    },err=>{
      console.error(err);
      setStatus("Firebaseの読み込み権限がありません。",true);
    });

    db.ref(path("items")).on("value",snapshot=>{
      const data=snapshot.val();
      items=normalizeItems(data);
      render();

      // 旧形式（IDなし）の項目は一度だけ新形式へ移行する。
      const rawList=Array.isArray(data) ? data : (data ? Object.values(data) : []);
      if(rawList.some(item=>item && !item.id)){
        db.ref(path("items")).transaction(current=>normalizeItems(current)).catch(console.error);
      }
    },err=>{
      console.error(err);
      setStatus("項目データの読み込み権限がありません。",true);
    });

    db.ref(path("teiki")).on("value",snapshot=>{
      teikiText=snapshot.val() || "";
      $("teikiText").value=teikiText;
    },err=>{
      console.error(err);
    });

    loadShared();
  }catch(err){
    console.error(err);
    setStatus("Firebase接続エラー。基本操作は画面上で利用できます。",true);
    render();
  }
}

render();
startFirebase();
</script>
</body>
</html>
